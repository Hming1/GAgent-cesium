# Optional override for local development only.
#
# This intentionally relaxes the Python analysis sandbox so code executed by the
# agent can run as root and install packages at runtime. Do not use this override
# in production or with untrusted users/prompts.
#
# Usage:
#   docker-compose -f dev.docker-compose.yml -f docker-compose.sandbox-unrestricted.yml up --build analysis-sandbox backend
#   docker-compose -f docker-compose.yml -f docker-compose.sandbox-unrestricted.yml up --build
services:
  analysis-sandbox:
    user: root
    read_only: false
    security_opt: !reset []
    cap_drop: !reset []
    environment:
      - SANDBOX_MAX_SECONDS=${SANDBOX_MAX_SECONDS:-120}
      - SANDBOX_MAX_OUTPUT_BYTES=${SANDBOX_MAX_OUTPUT_BYTES:-4194304}
      - PIP_INDEX_URL=${PIP_INDEX_URL:-https://pypi.org/simple}
      - PIP_TRUSTED_HOST=${PIP_TRUSTED_HOST:-}
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1,backend,analysis-sandbox}
      - http_proxy=${http_proxy:-}
      - https_proxy=${https_proxy:-}
      - no_proxy=${no_proxy:-localhost,127.0.0.1,backend,analysis-sandbox}
    tmpfs:
      - /tmp:size=2g
