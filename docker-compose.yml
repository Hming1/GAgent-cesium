services:

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    environment:
      - BACKEND_PROTOCOL=http
      - BACKEND_URL=backend:8000
      - FRONTEND_PROTOCOL=http
      - FRONTEND_URL=frontend:3000
      - SECOND_FRONTEND_PROTOCOL=${SECOND_FRONTEND_PROTOCOL:-http}
      - SECOND_FRONTEND_URL=${SECOND_FRONTEND_URL:-host.docker.internal:3001}
      # Docker's embedded DNS resolves the backend/frontend service names and
      # also forwards external DNS lookups. Override this for your deployment if needed.
      - DNS_RESOLVER=${DNS_RESOLVER:-127.0.0.11}
    ports:
      - "80:80"
      - "${SECOND_FRONTEND_PROXY_PORT:-8081}:81"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  backend:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Override when Docker's default external DNS is unreachable.
    dns:
      - ${BACKEND_DNS_SERVER:-223.5.5.5}
    build:
      context: ./backend
      dockerfile: Dockerfile
    # .env is Compose's interpolation source, not automatically the
    # container's environment. Load shared values first, then the external profile.
    env_file:
      - .env
      - .env.external
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://app:app@db:5432/app}
      - GEODATA_DATABASE_URL=${GEODATA_DATABASE_URL:-postgresql://app:app@db:5432/layers}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LLM_PROVIDER=${LLM_PROVIDER}
      - VLLM_BASE_URL=${VLLM_BASE_URL:-}
      - VLLM_METRICS_URL=${VLLM_METRICS_URL:-}
      - VLLM_MODEL=${VLLM_MODEL:-}
      - VLLM_API_KEY=${VLLM_API_KEY:-none}
      - VLLM_MAX_TOKENS=${VLLM_MAX_TOKENS:-4096}
      - VLLM_CONTEXT_WINDOW=${VLLM_CONTEXT_WINDOW:-32768}
      - VLLM_TEMPERATURE=${VLLM_TEMPERATURE:-0.5}
      - VLLM_ENABLE_THINKING=${VLLM_ENABLE_THINKING:-false}
      - REGISTRATION_MODE=${REGISTRATION_MODE:-invite}
      - OIDC_PROVIDERS=${OIDC_PROVIDERS}
      - OIDC_GOOGLE_ISSUER=${OIDC_GOOGLE_ISSUER}
      - OIDC_GOOGLE_CLIENT_ID=${OIDC_GOOGLE_CLIENT_ID}
      - OIDC_GOOGLE_CLIENT_SECRET=${OIDC_GOOGLE_CLIENT_SECRET}
      - OIDC_NEPHELE_ISSUER=${OIDC_NEPHELE_ISSUER}
      - OIDC_NEPHELE_CLIENT_ID=${OIDC_NEPHELE_CLIENT_ID}
      - OIDC_NEPHELE_CLIENT_SECRET=${OIDC_NEPHELE_CLIENT_SECRET}
      - PYTHON_ANALYSIS_SANDBOX_URL=${PYTHON_ANALYSIS_SANDBOX_URL:-http://analysis-sandbox:8080}
      - PYTHON_ANALYSIS_SANDBOX_TIMEOUT=${PYTHON_ANALYSIS_SANDBOX_TIMEOUT:-35}
      - PYTHON_ANALYSIS_MAX_FEATURES_PER_LAYER=${PYTHON_ANALYSIS_MAX_FEATURES_PER_LAYER:-500}
      - PYTHON_ANALYSIS_MAX_OUTPUT_BYTES=${PYTHON_ANALYSIS_MAX_OUTPUT_BYTES:-1048576}
    ports:
      - "8000:8000"
    depends_on:
      analysis-sandbox:
        condition: service_started
      db:
        condition: service_healthy
    networks:
      - default
      - sandbox

  analysis-sandbox:
    build:
      context: ./sandbox
      dockerfile: Dockerfile
    environment:
      - SANDBOX_MAX_SECONDS=${SANDBOX_MAX_SECONDS:-30}
      - SANDBOX_MAX_OUTPUT_BYTES=${SANDBOX_MAX_OUTPUT_BYTES:-1048576}
      - PIP_INDEX_URL=${PIP_INDEX_URL:-https://pypi.org/simple}
    # Docker may hand this container public resolvers (8.8.8.8/1.1.1.1) that are
    # unreachable on some hosts, which silently breaks every outbound lookup and
    # any runtime pip install. Pin explicitly and allow override per environment.
    dns:
      - ${SANDBOX_DNS_PRIMARY:-192.168.31.1}
      - ${SANDBOX_DNS_SECONDARY:-223.5.5.5}
    read_only: true
    tmpfs:
      - /tmp:size=256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - sandbox
  
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_TIANDITU_TOKEN: ${NEXT_PUBLIC_TIANDITU_TOKEN:-}
    env_file:
      - .env
      - .env.external
    environment:
      - RUNTIME_ENV_PATH=/app/runtime-env/runtime-env.js
    ports:
      - "3000:3000"

  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports: ["5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init-layers-db.sh:/docker-entrypoint-initdb.d/20-create-layers-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
    postgres-data:

networks:
  sandbox:
    internal: false

