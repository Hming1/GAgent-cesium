version: '3.8'
services:
  backend:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Override when Docker's default external DNS is unreachable.
    dns:
      - ${BACKEND_DNS_SERVER:-223.5.5.5}
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
      - .env.local
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://app:app@db:5432/app}
      - GEODATA_DATABASE_URL=${GEODATA_DATABASE_URL:-postgresql://app:app@db:5432/layers}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LLM_PROVIDER=${LLM_PROVIDER}
      - ALLOWED_CORS_ORIGINS=http://localhost:3000,http://frontend:3000
      - REGISTRATION_MODE=${REGISTRATION_MODE:-invite}
      - COOKIE_SECURE=false
      - PYTHON_ANALYSIS_SANDBOX_URL=${PYTHON_ANALYSIS_SANDBOX_URL:-http://analysis-sandbox:8080}
      - PYTHON_ANALYSIS_SANDBOX_TIMEOUT=${PYTHON_ANALYSIS_SANDBOX_TIMEOUT:-35}
      - PYTHON_ANALYSIS_MAX_FEATURES_PER_LAYER=${PYTHON_ANALYSIS_MAX_FEATURES_PER_LAYER:-500}
      - PYTHON_ANALYSIS_MAX_OUTPUT_BYTES=${PYTHON_ANALYSIS_MAX_OUTPUT_BYTES:-1048576}
    command: /app/.venv/bin/uvicorn main:app --reload --host 0.0.0.0 --port 8000 # auto-reload enabled
    depends_on:
      analysis-sandbox:
        condition: service_started
      db:
        condition: service_healthy
    networks:
      - default
      - sandbox

  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports: ["5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init-layers-db.sh:/docker-entrypoint-initdb.d/20-create-layers-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 10

  analysis-sandbox:
    build:
      context: ./sandbox
      dockerfile: Dockerfile
    ports:
      - "${PYTHON_ANALYSIS_SANDBOX_HOST_PORT:-18080}:8080"
    environment:
      - SANDBOX_MAX_SECONDS=${SANDBOX_MAX_SECONDS:-30}
      - SANDBOX_MAX_OUTPUT_BYTES=${SANDBOX_MAX_OUTPUT_BYTES:-1048576}
    read_only: true
    tmpfs:
      - /tmp:size=256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - sandbox

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    env_file:
      - .env
      - .env.local
    volumes:
      - ./frontend:/app
      - /app/node_modules # prevents overwriting container node_modules with host’s empty folder
    environment:
      - BACKEND_PROTOCOL=http
      - BACKEND_URL=backend:8000
      - RUNTIME_ENV_PATH=/app/runtime-env/runtime-env.js
    ports:
      - "3000:3000"
    command: yarn dev # starts Next.js in dev mode with hot reloading
    depends_on:
      - backend

volumes:
  postgres-data:

networks:
  sandbox:
    internal: false
