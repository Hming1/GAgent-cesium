services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports: ["5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-layers-db.sh:/docker-entrypoint-initdb.d/20-create-layers-db.sh:ro
volumes:
  postgres-data:
